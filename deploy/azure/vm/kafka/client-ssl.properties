# Client settings for the on-VM smoke test and for Container Apps clients.
# Clients trust the Kafka CA (PEM) generated on the VM; the broker certificate
# carries the VM private IP as a SAN, so hostname verification stays enabled.
# Must stay free of passwords: it is non-secret and deployed 0644.
security.protocol=SSL
ssl.truststore.type=PEM
ssl.truststore.location=/etc/researchtrack/kafka-tls/ca.crt
