# Shared edge settings. Copied as-is into /opt/researchtrack/nginx/conf.d.

server_tokens off;

log_format researchtrack '$remote_addr - $remote_user [$time_local] "$host" "$request" '
                         '$status $body_bytes_sent $request_time "$http_referer" '
                         '"$http_user_agent" upstream=$upstream_addr';
# stdout/stderr are rotated by Docker's json-file driver (configure-vm.sh).
access_log /var/log/nginx/access.log researchtrack;

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# Resolve Container Apps FQDNs at request time: Docker DNS -> Azure DNS ->
# private DNS zone for the Container Apps environment.
resolver 127.0.0.11 valid=30s ipv6=off;

# Anything not addressed to a known hostname (e.g. scans of the bare IP).
server {
    listen 80 default_server;
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    location / {
        return 444;
    }
}

server {
    listen 443 ssl default_server;
    ssl_reject_handshake on;
}
