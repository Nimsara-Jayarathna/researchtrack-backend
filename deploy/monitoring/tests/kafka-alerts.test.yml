---
rule_files:
- "../rules/researchtrack-alerts.yml"
evaluation_interval: 30s
tests:
- name: healthy broker and enabled idle application
  interval: 1m
  input_series:
  - series: up{job="researchtrack-kafka",instance="kafka-exporter:9308",service="kafka",environment="production"}
    values: 1x35
  - series: kafka_brokers{job="researchtrack-kafka",instance="kafka-exporter:9308",service="kafka",environment="production"}
    values: 1x35
  - series: kafka_topic_partition_current_offset{job="researchtrack-kafka",instance="kafka-exporter:9308",service="kafka",environment="production",topic="researchtrack.deployment-smoke",partition="0"}
    values: '0x35'
  - series: researchtrack_kafka_enabled{job="researchtrack-services",service="github",environment="production",instance="github:8080"}
    values: 1x35
  - series: researchtrack_kafka_outbox_sample_success{job="researchtrack-services",service="github",environment="production",instance="github:8080"}
    values: 1x35
  - series: researchtrack_kafka_outbox_sample_timestamp_seconds{job="researchtrack-services",service="github",environment="production",instance="github:8080"}
    values: 0+60x35
  alert_rule_test:
  - eval_time: 20m
    alertname: ResearchTrackKafkaExporterUnavailable
    exp_alerts: []
  - eval_time: 20m
    alertname: ResearchTrackKafkaBrokerUnavailable
    exp_alerts: []
  - eval_time: 20m
    alertname: ResearchTrackKafkaPublishingFailures
    exp_alerts: []
  - eval_time: 20m
    alertname: ResearchTrackKafkaEventProcessingFailures
    exp_alerts: []
  - eval_time: 20m
    alertname: ResearchTrackKafkaOffsetCommitFailures
    exp_alerts: []
  - eval_time: 20m
    alertname: ResearchTrackKafkaConsumerHeld
    exp_alerts: []
  - eval_time: 20m
    alertname: ResearchTrackKafkaConsumerLagHigh
    exp_alerts: []
  - eval_time: 20m
    alertname: ResearchTrackKafkaOutboxBacklog
    exp_alerts: []
  - eval_time: 20m
    alertname: ResearchTrackKafkaOutboxFailed
    exp_alerts: []
  - eval_time: 20m
    alertname: ResearchTrackKafkaOutboxMetricsUnavailable
    exp_alerts: []
- name: broker count zero
  interval: 1m
  input_series:
  - series: up{job="researchtrack-kafka",instance="kafka-exporter:9308",service="kafka",environment="production"}
    values: 1x35
  - series: kafka_brokers{job="researchtrack-kafka",instance="kafka-exporter:9308",service="kafka",environment="production"}
    values: '0x35'
  - series: kafka_topic_partition_current_offset{job="researchtrack-kafka",instance="kafka-exporter:9308",service="kafka",environment="production",topic="researchtrack.deployment-smoke",partition="0"}
    values: '0x35'
  - series: researchtrack_kafka_enabled{job="researchtrack-services",service="github",environment="production",instance="github:8080"}
    values: 1x35
  - series: researchtrack_kafka_outbox_sample_success{job="researchtrack-services",service="github",environment="production",instance="github:8080"}
    values: 1x35
  - series: researchtrack_kafka_outbox_sample_timestamp_seconds{job="researchtrack-services",service="github",environment="production",instance="github:8080"}
    values: 0+60x35
  alert_rule_test:
  - eval_time: 3m
    alertname: ResearchTrackKafkaExporterUnavailable
    exp_alerts: []
  - eval_time: 3m
    alertname: ResearchTrackKafkaBrokerUnavailable
    exp_alerts:
    - exp_labels:
        job: researchtrack-kafka
        instance: kafka-exporter:9308
        service: kafka
        environment: production
        severity: critical
        category: kafka
        component: broker
      exp_annotations:
        summary: Kafka broker connectivity or required metadata unavailable
        description: Exporter is scrapeable but broker count or a live deployment-smoke
          partition offset is missing/invalid. Inspect broker health, private listener
          and existing smoke-topic metadata; never recreate data to repair monitoring.
  - eval_time: 3m
    alertname: ResearchTrackKafkaPublishingFailures
    exp_alerts: []
  - eval_time: 3m
    alertname: ResearchTrackKafkaEventProcessingFailures
    exp_alerts: []
  - eval_time: 3m
    alertname: ResearchTrackKafkaOffsetCommitFailures
    exp_alerts: []
  - eval_time: 3m
    alertname: ResearchTrackKafkaConsumerHeld
    exp_alerts: []
  - eval_time: 3m
    alertname: ResearchTrackKafkaConsumerLagHigh
    exp_alerts: []
  - eval_time: 3m
    alertname: ResearchTrackKafkaOutboxBacklog
    exp_alerts: []
  - eval_time: 3m
    alertname: ResearchTrackKafkaOutboxFailed
    exp_alerts: []
  - eval_time: 3m
    alertname: ResearchTrackKafkaOutboxMetricsUnavailable
    exp_alerts: []
- name: exporter scrape failure has distinct root cause
  interval: 1m
  input_series:
  - series: up{job="researchtrack-kafka",instance="kafka-exporter:9308",service="kafka",environment="production"}
    values: '0x35'
  - series: kafka_brokers{job="researchtrack-kafka",instance="kafka-exporter:9308",service="kafka",environment="production"}
    values: 1x35
