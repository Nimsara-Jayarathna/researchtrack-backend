- name: repeated publication failures
  interval: 1m
  input_series:
  - series: up{job="researchtrack-kafka",instance="kafka-exporter:9308",service="kafka",environment="production"}
    values: 1x35
  - series: kafka_brokers{job="researchtrack-kafka",instance="kafka-exporter:9308",service="kafka",environment="production"}
    values: 1x35
  - series: kafka_topic_partition_current_offset{job="researchtrack-kafka",instance="kafka-exporter:9308",service="kafka",environment="production",topic="researchtrack.deployment-smoke",partition="0"}
    values: '0x35'
  - series: researchtrack_kafka_enabled{job="researchtrack-services",service="github",environment="production",instance="github:8080"}
