  - series: researchtrack_kafka_outbox_sample_success{job="researchtrack-services",service="github",environment="production",instance="github:8080"}
    values: 1x35
  - series: researchtrack_kafka_outbox_sample_timestamp_seconds{job="researchtrack-services",service="github",environment="production",instance="github:8080"}
    values: 0+60x35
  - series: researchtrack_kafka_publish_total{job="researchtrack-services",service="github",environment="production",instance="github:8080",outcome="retryable_failure"}
    values: 0+2x35
  alert_rule_test:
  - eval_time: 5m
    alertname: ResearchTrackKafkaExporterUnavailable
    exp_alerts: []
  - eval_time: 5m
    alertname: ResearchTrackKafkaBrokerUnavailable
    exp_alerts: []
  - eval_time: 5m
    alertname: ResearchTrackKafkaPublishingFailures
    exp_alerts:
    - exp_labels:
        service: github
        environment: production
        severity: warning
        category: kafka
        component: application
      exp_annotations:
        summary: Repeated Kafka publication failures
        description: At least three publication attempts failed within ten minutes.
          Inspect TLS/private connectivity and retained outbox work; replay requires
          review.
  - eval_time: 5m
    alertname: ResearchTrackKafkaEventProcessingFailures
    exp_alerts: []
  - eval_time: 5m
    alertname: ResearchTrackKafkaOffsetCommitFailures
