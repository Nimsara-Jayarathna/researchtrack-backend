    values: '0x35'
  - series: researchtrack_kafka_enabled{job="researchtrack-services",service="github",environment="production",instance="github:8080"}
    values: 1x35
  - series: researchtrack_kafka_outbox_sample_success{job="researchtrack-services",service="github",environment="production",instance="github:8080"}
    values: 1x35
  - series: researchtrack_kafka_outbox_sample_timestamp_seconds{job="researchtrack-services",service="github",environment="production",instance="github:8080"}
    values: 0+60x35
  alert_rule_test:
  - eval_time: 3m
    alertname: ResearchTrackKafkaExporterUnavailable
    exp_alerts:
    - exp_labels:
        job: researchtrack-kafka
        instance: kafka-exporter:9308
        service: kafka
        environment: production
        severity: critical
        category: kafka
        component: exporter
      exp_annotations:
        summary: Kafka exporter unavailable; broker status unknown
        description: Check the private exporter target, container and logs. Broker
          connection failure can prevent exporter startup; do not infer broker health
          from a missing scrape.
  - eval_time: 3m
    alertname: ResearchTrackKafkaBrokerUnavailable
    exp_alerts: []
  - eval_time: 3m
    alertname: ResearchTrackKafkaPublishingFailures
    exp_alerts: []
  - eval_time: 3m
    alertname: ResearchTrackKafkaEventProcessingFailures
    exp_alerts: []
  - eval_time: 3m
    alertname: ResearchTrackKafkaOffsetCommitFailures
    exp_alerts: []
  - eval_time: 3m
    alertname: ResearchTrackKafkaConsumerHeld
    exp_alerts: []
  - eval_time: 3m
    alertname: ResearchTrackKafkaConsumerLagHigh
    exp_alerts: []
  - eval_time: 3m
    alertname: ResearchTrackKafkaOutboxBacklog
    exp_alerts: []
  - eval_time: 3m
    alertname: ResearchTrackKafkaOutboxFailed
    exp_alerts: []
  - eval_time: 3m
