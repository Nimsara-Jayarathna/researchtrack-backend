name: researchtrack-${DEPLOY_ENV}

services:
  gateway:
    image: ${IMAGE_PREFIX}/researchtrack-gateway:${DEPLOY_ENV}
    restart: unless-stopped
    env_file:
      - ./env/gateway.env
    networks:
      edge:
        aliases:
          - researchtrack-gateway-${DEPLOY_ENV}
      backend: {}
    mem_limit: ${GATEWAY_MEMORY_LIMIT:-384m}
    cpus: ${GATEWAY_CPU_LIMIT:-0.50}

  auth:
    image: ${IMAGE_PREFIX}/researchtrack-auth:${DEPLOY_ENV}
    restart: unless-stopped
    env_file:
      - ./env/shared-auth.env
      - ./env/auth.env
    networks:
      backend: {}
      database: {}
    depends_on:
      mysql:
        condition: service_healthy
    mem_limit: ${AUTH_MEMORY_LIMIT:-384m}
    cpus: ${AUTH_CPU_LIMIT:-0.50}

  project:
    image: ${IMAGE_PREFIX}/researchtrack-project:${DEPLOY_ENV}
    restart: unless-stopped
    env_file:
      - ./env/shared-auth.env
      - ./env/project.env
    networks:
      backend: {}
      database: {}
    depends_on:
      mysql:
        condition: service_healthy
    mem_limit: ${PROJECT_MEMORY_LIMIT:-384m}
    cpus: ${PROJECT_CPU_LIMIT:-0.50}

  github:
    image: ${IMAGE_PREFIX}/researchtrack-github:${DEPLOY_ENV}
    restart: unless-stopped
    env_file:
      - ./env/shared-auth.env
      - ./env/github.env
    networks:
      backend: {}
      database: {}
    depends_on:
      mysql:
        condition: service_healthy
    mem_limit: ${GITHUB_MEMORY_LIMIT:-320m}
    cpus: ${GITHUB_CPU_LIMIT:-0.40}

  jira:
    image: ${IMAGE_PREFIX}/researchtrack-jira:${DEPLOY_ENV}
    restart: unless-stopped
    env_file:
      - ./env/shared-auth.env
      - ./env/jira.env
    networks:
      backend: {}
      database: {}
    depends_on:
      mysql:
        condition: service_healthy
    mem_limit: ${JIRA_MEMORY_LIMIT:-320m}
    cpus: ${JIRA_CPU_LIMIT:-0.40}

  meeting:
    image: ${IMAGE_PREFIX}/researchtrack-meeting:${DEPLOY_ENV}
    restart: unless-stopped
    env_file:
      - ./env/shared-auth.env
      - ./env/meeting.env
    networks:
      backend: {}
      database: {}
    depends_on:
      mysql:
        condition: service_healthy
    mem_limit: ${MEETING_MEMORY_LIMIT:-320m}
    cpus: ${MEETING_CPU_LIMIT:-0.40}

  submission:
    image: ${IMAGE_PREFIX}/researchtrack-submission:${DEPLOY_ENV}
    restart: unless-stopped
    env_file:
      - ./env/shared-auth.env
      - ./env/submission.env
    networks:
      backend: {}
      database: {}
    depends_on:
      mysql:
        condition: service_healthy
    mem_limit: ${SUBMISSION_MEMORY_LIMIT:-320m}
    cpus: ${SUBMISSION_CPU_LIMIT:-0.40}

  kafka-init:
    image: apache/kafka:3.9.1
    profiles:
      - kafka
    user: "0:0"
    restart: "no"
    entrypoint:
      - /bin/sh
      - -c
    command:
      - chown -R 1000:1000 /tmp/kraft-combined-logs
    volumes:
      - kafka-data:/tmp/kraft-combined-logs
    networks:
      backend: {}
    mem_limit: 128m
    cpus: 0.10

  kafka:
    image: apache/kafka:3.9.1
    profiles:
      - kafka
    restart: unless-stopped
    user: "1000:1000"
    depends_on:
      kafka-init:
        condition: service_completed_successfully
    environment:
      CLUSTER_ID: ${KAFKA_CLUSTER_ID:?KAFKA_CLUSTER_ID must be set}

      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: "broker,controller"

      KAFKA_LISTENERS: "PLAINTEXT://:9092,CONTROLLER://:9093"
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://kafka:9092"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT"
      KAFKA_INTER_BROKER_LISTENER_NAME: "PLAINTEXT"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka:9093"

      KAFKA_LOG_DIRS: "/tmp/kraft-combined-logs"

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"

      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_NUM_PARTITIONS: "1"
      KAFKA_LOG_RETENTION_HOURS: "24"

      KAFKA_HEAP_OPTS: "-Xms256m -Xmx512m"

    volumes:
      - kafka-data:/tmp/kraft-combined-logs

    networks:
      backend: {}

    healthcheck:
      test:
        - CMD
        - /opt/kafka/bin/kafka-topics.sh
        - --bootstrap-server
        - kafka:9092
        - --list
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 45s

    mem_limit: 1g
    cpus: 0.50
    stop_grace_period: 60s

  prometheus:
    image: prom/prometheus:latest
    restart: unless-stopped
    volumes:
      - type: bind
        source: ./monitoring/prometheus.yml
        target: /etc/prometheus/prometheus.yml
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./monitoring/rules
        target: /etc/prometheus/rules
        read_only: true
        bind:
          create_host_path: false
      - prometheus-data:/prometheus
    networks:
      backend: {}
    mem_limit: ${PROMETHEUS_MEMORY_LIMIT:-256m}
    cpus: ${PROMETHEUS_CPU_LIMIT:-0.25}

  grafana:
    image: grafana/grafana:latest
    restart: unless-stopped
    env_file:
      - ./env/grafana.env
    ports:
      - "127.0.0.1:${GRAFANA_HOST_PORT:-9000}:3000"
    volumes:
      - grafana-data:/var/lib/grafana
      - type: bind
        source: ./monitoring/grafana/provisioning
        target: /etc/grafana/provisioning
        read_only: true
        bind:
          create_host_path: false
    networks:
      backend: {}
    mem_limit: ${GRAFANA_MEMORY_LIMIT:-256m}
    cpus: ${GRAFANA_CPU_LIMIT:-0.25}

  mysql:
    image: mysql:8.4
    restart: unless-stopped
    env_file:
      - ./env/mysql.env
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --max-connections=100
    volumes:
      - mysql-data:/var/lib/mysql
      - type: bind
        source: ./mysql/reconcile-databases.sh
        target: /docker-entrypoint-initdb.d/01-reconcile-databases.sh
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./mysql/reconcile-databases.sh
        target: /opt/researchtrack/reconcile-databases.sh
        read_only: true
        bind:
          create_host_path: false
    networks:
      database: {}
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mysqladmin ping -h 127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent",
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
    mem_limit: ${MYSQL_MEMORY_LIMIT:-896m}
    cpus: ${MYSQL_CPU_LIMIT:-0.75}

volumes:
  mysql-data:
  prometheus-data:
  grafana-data:
  kafka-data:

networks:
  edge:
    external: true
    name: ${EDGE_NETWORK:-npm_default}
  backend:
    driver: bridge
  database:
    driver: bridge
    internal: true