name: Backend Deploy - Production

on:
  push:
    branches: ["main"]
  workflow_dispatch:
    inputs:
      force_full_build:
        description: Build and publish all backend service images before deploying.
        required: false
        type: boolean
        default: false
      force_redeploy:
        description: Re-run DB checks/migrations and roll out every Container App even if unchanged.
        required: false
        type: boolean
        default: false

concurrency:
  # Shared with azure-infrastructure.yml so rollouts and VM reconciles never overlap.
  group: researchtrack-azure-production
  cancel-in-progress: false
  queue: max

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  # Production runs on Azure Container Apps + an infrastructure VM. Test keeps
  # using the VPS/Compose path in backend-deploy-reusable.yml.
  deploy:
    name: Build and Deploy Azure Production
    uses: ./.github/workflows/backend-deploy-azure-production.yml
    with:
      force_full_build: ${{ inputs.force_full_build || false }}
      force_redeploy: ${{ inputs.force_redeploy || false }}
    permissions:
      contents: read
      packages: write
      id-token: write
    secrets: inherit

  performance_smoke:
    name: Automatic post-deployment k6 Smoke
    needs: deploy
    if: ${{ needs.deploy.result == 'success' && vars.K6_AUTO_SMOKE_ENABLED == 'true' }}
    uses: ./.github/workflows/azure-performance-k6-reusable.yml
    with:
      profile: smoke
      execution_mode: automatic-post-deploy
      confirmation: ''
      # Automatic Smoke intentionally uses normal Gateway rate limiting. Heavy
      # manual capacity profiles can still opt into the scoped VPS exemption.
      rate_limit_bypass_enabled: false
      p95_override_ms: ''
    permissions:
      contents: read
      id-token: write
    secrets: inherit

