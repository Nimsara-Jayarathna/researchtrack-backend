name: Backend Build Images

on:
  workflow_call:
    inputs:
      image_tag:
        required: true
        type: string
      force_full_build:
        required: false
        type: boolean
        default: false
      selection:
        # diff:        build services affected by this push's changes (Test).
        # fingerprint: build every service whose image for the current source
        #              is not published yet, independent of push history (Production).
        required: false
        type: string
        default: diff
    outputs:
      services:
        description: Space-separated Compose services whose images were rebuilt.
        value: ${{ jobs.detect.outputs.services }}
      has_changes:
        description: Whether any backend deployable image needed rebuilding.
        value: ${{ jobs.detect.outputs.has_changes }}
      image_tags:
        description: JSON map service -> source-fingerprint image tag (fingerprint selection only).
        value: ${{ jobs.detect.outputs.image_tags }}

permissions:
  contents: read
  packages: write

jobs:
  detect:
    name: Detect Affected Services
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    outputs:
      matrix: ${{ steps.changes.outputs.matrix }}
      services: ${{ steps.changes.outputs.services }}
      has_changes: ${{ steps.changes.outputs.has_changes }}
      image_tags: ${{ steps.changes.outputs.image_tags }}

    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Login to GitHub Container Registry
        if: inputs.selection == 'fingerprint'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The dependency model (project references, shared build inputs, known
      # non-image paths, conservative fallback) lives in deploy/build/service-impact.py.
      - name: Detect affected deployables
        id: changes
        shell: bash
        env:
          SELECTION: ${{ inputs.selection }}
          FORCE_FULL_BUILD: ${{ inputs.force_full_build }}
          BEFORE_SHA: ${{ github.event.before }}
          OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          case "$SELECTION" in
            diff)
              python3 deploy/build/service-impact.py impact \
                --head "$GITHUB_SHA" --base "$BEFORE_SHA" --force "$FORCE_FULL_BUILD"
              ;;
            fingerprint)
              python3 deploy/build/service-impact.py plan \
                --head "$GITHUB_SHA" --base "$BEFORE_SHA" --force "$FORCE_FULL_BUILD" \
                --image-prefix "ghcr.io/${OWNER,,}"
              ;;
            *)
              echo "Unknown selection '$SELECTION' (expected diff or fingerprint)." >&2
              exit 1
              ;;
          esac

  build:
    name: Build ${{ matrix.service }}
    needs: detect
    if: needs.detect.outputs.has_changes == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJSON(needs.detect.outputs.matrix) }}

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve service metadata
        id: meta
        shell: bash
        env:
          SERVICE: ${{ matrix.service }}
          SOURCE_TAG: ${{ fromJSON(needs.detect.outputs.image_tags || '{}')[matrix.service] || '' }}
          IMAGE_TAG: ${{ inputs.image_tag }}
          OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          meta="$(python3 deploy/build/service-impact.py meta --service "$SERVICE")"
          field() { sed -n "s/^$1=//p" <<<"$meta"; }
          project="$(field project)"
          dll="$(field dll)"
          context="$(field context)"
          image_repo="ghcr.io/${OWNER,,}/$(field image)"

          {
            echo "project=$project"
            echo "dll=$dll"
            echo "context=$context"
            echo "image_repo=$image_repo"
            echo 'tags<<EOF'
            echo "$image_repo:$IMAGE_TAG"
            echo "$image_repo:$GITHUB_SHA"
            [[ -z "$SOURCE_TAG" ]] || echo "$image_repo:$SOURCE_TAG"
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile.service
          push: true
          build-args: |
            PROJECT_PATH=${{ steps.meta.outputs.project }}
            APP_DLL=${{ steps.meta.outputs.dll }}
            DB_CONTEXT=${{ steps.meta.outputs.context }}
          tags: ${{ steps.meta.outputs.tags }}
          # Provenance: lets the deployment prove which commit/source an image holds.
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.title=researchtrack-${{ matrix.service }}
            io.researchtrack.service=${{ matrix.service }}
            io.researchtrack.source-tag=${{ fromJSON(needs.detect.outputs.image_tags || '{}')[matrix.service] || '' }}
          cache-from: type=gha,scope=backend-${{ matrix.service }}
          cache-to: type=gha,scope=backend-${{ matrix.service }},mode=max
