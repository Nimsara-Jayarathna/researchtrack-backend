name: Backend Build Images

on:
  workflow_call:
    inputs:
      image_tag:
        required: true
        type: string
    outputs:
      services:
        description: Space-separated Compose services whose images were rebuilt.
        value: ${{ jobs.detect.outputs.services }}
      has_changes:
        description: Whether any backend deployable image needed rebuilding.
        value: ${{ jobs.detect.outputs.has_changes }}

permissions:
  contents: read
  packages: write

jobs:
  detect:
    name: Detect Affected Services
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.changes.outputs.matrix }}
      services: ${{ steps.changes.outputs.services }}
      has_changes: ${{ steps.changes.outputs.has_changes }}

    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect affected deployables
        id: changes
        shell: bash
        run: |
          set -euo pipefail

          before="${{ github.event.before }}"
          after="${{ github.sha }}"

          if [[ -z "$before" || "$before" =~ ^0+$ ]]; then
            before="$(git rev-parse "${after}^" 2>/dev/null || echo "$after")"
          fi

          changed="$(git diff --name-only "$before" "$after" || true)"
          echo "Changed files:"
          printf '%s\n' "$changed"

          services=()
          add_service() {
            local service="$1"
            [[ " ${services[*]} " == *" $service "* ]] || services+=("$service")
          }

          # Shared compilation/deployment-image inputs can affect every executable.
          if grep -Eq '^(src/BuildingBlocks/|Directory\.Build\.props$|Directory\.Packages\.props$|global\.json$|ResearchTrack\.sln$|dotnet-tools\.json$|deploy/Dockerfile\.service$)' <<<"$changed"; then
            services=(gateway auth project github jira meeting submission)
          else
            grep -q '^src/Gateway/ResearchTrack.Gateway/' <<<"$changed" && add_service gateway || true
            grep -q '^src/Services/ResearchTrack.AuthService/' <<<"$changed" && add_service auth || true
            grep -q '^src/Services/ResearchTrack.ProjectService/' <<<"$changed" && add_service project || true
            grep -q '^src/Services/ResearchTrack.GitHubService/' <<<"$changed" && add_service github || true
            grep -q '^src/Services/ResearchTrack.JiraService/' <<<"$changed" && add_service jira || true
            grep -q '^src/Services/ResearchTrack.MeetingService/' <<<"$changed" && add_service meeting || true
            grep -q '^src/Services/ResearchTrack.SubmissionService/' <<<"$changed" && add_service submission || true
          fi

          if ((${#services[@]} == 0)); then
            echo 'matrix=[]' >> "$GITHUB_OUTPUT"
            echo 'services=' >> "$GITHUB_OUTPUT"
            echo 'has_changes=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          matrix="$(printf '%s\n' "${services[@]}" | jq -R . | jq -sc .)"
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          echo "services=${services[*]}" >> "$GITHUB_OUTPUT"
          echo 'has_changes=true' >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.service }}
    needs: detect
    if: needs.detect.outputs.has_changes == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJSON(needs.detect.outputs.matrix) }}

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve service metadata
        id: meta
        shell: bash
        run: |
          set -euo pipefail

          case "${{ matrix.service }}" in
            gateway)
              project='src/Gateway/ResearchTrack.Gateway/ResearchTrack.Gateway.csproj'
              dll='ResearchTrack.Gateway.dll'
              context=''
              image='researchtrack-gateway'
              ;;
            auth)
              project='src/Services/ResearchTrack.AuthService/ResearchTrack.AuthService.csproj'
              dll='ResearchTrack.AuthService.dll'
              context='AuthDbContext'
              image='researchtrack-auth'
              ;;
            project)
              project='src/Services/ResearchTrack.ProjectService/ResearchTrack.ProjectService.csproj'
              dll='ResearchTrack.ProjectService.dll'
              context='ProjectDbContext'
              image='researchtrack-project'
              ;;
            github)
              project='src/Services/ResearchTrack.GitHubService/ResearchTrack.GitHubService.csproj'
              dll='ResearchTrack.GitHubService.dll'
              context='GitHubDbContext'
              image='researchtrack-github'
              ;;
            jira)
              project='src/Services/ResearchTrack.JiraService/ResearchTrack.JiraService.csproj'
              dll='ResearchTrack.JiraService.dll'
              context='JiraDbContext'
              image='researchtrack-jira'
              ;;
            meeting)
              project='src/Services/ResearchTrack.MeetingService/ResearchTrack.MeetingService.csproj'
              dll='ResearchTrack.MeetingService.dll'
              context='MeetingDbContext'
              image='researchtrack-meeting'
              ;;
            submission)
              project='src/Services/ResearchTrack.SubmissionService/ResearchTrack.SubmissionService.csproj'
              dll='ResearchTrack.SubmissionService.dll'
              context='SubmissionDbContext'
              image='researchtrack-submission'
              ;;
            *)
              echo "Unknown service: ${{ matrix.service }}" >&2
              exit 1
              ;;
          esac

          owner="$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          image_repo="ghcr.io/$owner/$image"

          echo "project=$project" >> "$GITHUB_OUTPUT"
          echo "dll=$dll" >> "$GITHUB_OUTPUT"
          echo "context=$context" >> "$GITHUB_OUTPUT"
          echo "image_repo=$image_repo" >> "$GITHUB_OUTPUT"

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile.service
          push: true
          build-args: |
            PROJECT_PATH=${{ steps.meta.outputs.project }}
            APP_DLL=${{ steps.meta.outputs.dll }}
            DB_CONTEXT=${{ steps.meta.outputs.context }}
          tags: |
            ${{ steps.meta.outputs.image_repo }}:${{ inputs.image_tag }}
            ${{ steps.meta.outputs.image_repo }}:${{ github.sha }}
          cache-from: type=gha,scope=backend-${{ matrix.service }}
          cache-to: type=gha,scope=backend-${{ matrix.service }},mode=max
