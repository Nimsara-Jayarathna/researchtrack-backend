name: Backend Deploy Azure Production

# Application release to Azure Production, called by backend-deploy-production.yml.
# Production is intentionally allowed to be powered down between uses. This
# workflow borrows the runtime transactionally: capture its exact stable state,
# wake it, deploy/verify, then restore the exact original VM + Container App
# power states even when deployment fails. Long-lived infrastructure itself is
# reconciled separately by azure-infrastructure.yml.
# The Test/VPS path (backend-deploy-test.yml -> backend-deploy-reusable.yml)
# is intentionally untouched.

on:
  workflow_call:
    inputs:
      force_full_build:
        required: false
        type: boolean
        default: false
      force_redeploy:
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  packages: read

jobs:
  build:
    name: Build Changed Images
    uses: ./.github/workflows/backend-build-images.yml
    with:
      image_tag: production
      force_full_build: ${{ inputs.force_full_build }}
      # Production converges on the image for the current source of every
      # service, so a change missed by an earlier failed/other-branch run is
      # still built and deployed.
      selection: fingerprint
    permissions:
      contents: read
      packages: write

  deploy:
    name: Deploy Azure Production
    needs: build
    runs-on: ubuntu-latest
    environment: production

    permissions:
      contents: read
      packages: read
      id-token: write

    env:
      RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP || 'rg-researchtrack-prod' }}
      ACA_ENVIRONMENT: ${{ vars.AZURE_CONTAINERAPPS_ENVIRONMENT || 'cae-researchtrack-prod' }}
      INFRA_VM: ${{ vars.AZURE_INFRA_VM || 'vm-researchtrack-infra-prod' }}
      INFRA_PRIVATE_IP: ${{ vars.AZURE_INFRA_PRIVATE_IP || '10.20.10.4' }}
      API_HOSTNAME: ${{ vars.PRODUCTION_API_HOSTNAME || 'api.researchtrack.blipzo.xyz' }}
      GRAFANA_HOSTNAME: ${{ vars.PRODUCTION_GRAFANA_HOSTNAME || 'grafana.researchtrack.blipzo.xyz' }}
      FORBIDDEN_HOSTS: ${{ vars.TEST_HOSTNAMES }}

    steps:
      - name: Checkout deployment files
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            deploy
            config/env
          sparse-checkout-cone-mode: false

      - name: Validate workflow configuration
        shell: bash
        env:
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
        run: |
          set -euo pipefail
          for key in AZURE_CLIENT_ID AZURE_TENANT_ID AZURE_SUBSCRIPTION_ID; do
            [[ -n "${!key:-}" ]] || { echo "$key is not configured for the production environment." >&2; exit 1; }
          done
          # runner.temp is not available in job-level env.
          echo "ENV_DIR=$RUNNER_TEMP/researchtrack-env" >> "$GITHUB_ENV"
          echo "WORK_DIR=$RUNNER_TEMP/researchtrack-specs" >> "$GITHUB_ENV"
          echo "RUNTIME_STATE_FILE=$RUNNER_TEMP/researchtrack-runtime-before-deploy.json" >> "$GITHUB_ENV"
          echo "RUNTIME_ACTIVE_FILE=$RUNNER_TEMP/researchtrack-runtime-deploy.active" >> "$GITHUB_ENV"

      - name: Materialize environment files
        shell: bash
        env:
          MYSQL_ENV_FILE: ${{ secrets.MYSQL_ENV_FILE }}
          SHARED_AUTH_ENV_FILE: ${{ secrets.SHARED_AUTH_ENV_FILE }}
          AUTH_ENV_FILE: ${{ secrets.AUTH_ENV_FILE }}
          PROJECT_ENV_FILE: ${{ secrets.PROJECT_ENV_FILE }}
          GITHUB_ENV_FILE: ${{ secrets.RT_GITHUB_SERVICE_ENV }}
          JIRA_ENV_FILE: ${{ secrets.JIRA_ENV_FILE }}
          MEETING_ENV_FILE: ${{ secrets.MEETING_ENV_FILE }}
          SUBMISSION_ENV_FILE: ${{ secrets.SUBMISSION_ENV_FILE }}
          GATEWAY_ENV_FILE: ${{ secrets.GATEWAY_ENV_FILE }}
          GRAFANA_ENV_FILE: ${{ secrets.GRAFANA_ENV_FILE }}
        run: |
          set -euo pipefail
          umask 077
          rm -rf "$ENV_DIR"
          mkdir -p "$ENV_DIR"

          write_secret() {
            [[ -n "$2" ]] || { echo "Required GitHub Environment secret for $1 is empty." >&2; exit 1; }
            printf '%s\n' "$2" > "$ENV_DIR/$1"
          }

          write_secret mysql.env "$MYSQL_ENV_FILE"
          write_secret shared-auth.env "$SHARED_AUTH_ENV_FILE"
          write_secret auth.env "$AUTH_ENV_FILE"
          write_secret project.env "$PROJECT_ENV_FILE"
          write_secret github.env "$GITHUB_ENV_FILE"
          write_secret jira.env "$JIRA_ENV_FILE"
          write_secret meeting.env "$MEETING_ENV_FILE"
          write_secret submission.env "$SUBMISSION_ENV_FILE"
          write_secret gateway.env "$GATEWAY_ENV_FILE"
          write_secret grafana.env "$GRAFANA_ENV_FILE"

      - name: Validate Azure Production environment files
        shell: bash
        run: |
          EXPECTED_MYSQL_HOST="$INFRA_PRIVATE_IP" EXPECTED_GRAFANA_HOSTNAME="$GRAFANA_HOSTNAME" \
            ./deploy/azure/validation/validate-azure-env-files.sh "$ENV_DIR" config/env

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Install Container Apps CLI extension
        shell: bash
        run: az extension add --name containerapp --upgrade --only-show-errors

      # Static preflight deliberately accepts Running, Stopped and Deallocated
      # VM states. Production being off is a normal cost-saving state. It also
      # exports ACA_ENV_DOMAIN for runtime readiness checks in later steps.
      - name: Static Azure infrastructure preflight
        shell: bash
        run: |
          set -euo pipefail
          ./deploy/azure/scripts/preflight.sh static

      - name: Capture exact pre-deployment runtime state
        shell: bash
        run: |
          set -euo pipefail
          ./deploy/azure/scripts/runtime-power.sh capture "$RUNTIME_STATE_FILE"
          ./deploy/azure/scripts/runtime-power.sh validate-snapshot "$RUNTIME_STATE_FILE"
          echo
          ./deploy/azure/scripts/runtime-power.sh status

      # The snapshot is intentionally persisted before the first power-state
      # mutation so an operator has a recovery record even if the runner dies.
      - name: Preserve pre-deployment runtime snapshot
        uses: actions/upload-artifact@v4
        with:
          name: azure-production-runtime-before-deploy-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.RUNTIME_STATE_FILE }}
          if-no-files-found: error
          retention-days: 7

      - name: Acquire Azure Production runtime
        shell: bash
        run: |
          set -euo pipefail

          # Refuse to take ownership if somebody changed power state after the
          # snapshot was captured. This prevents us restoring over an
          # out-of-band operator change made before acquisition.
          ./deploy/azure/scripts/runtime-power.sh verify "$RUNTIME_STATE_FILE"

          umask 077
          : > "$RUNTIME_ACTIVE_FILE"

          # If this partially fails, the workflow-level always() restoration
          # step sees the active marker and rolls back to the snapshot.
          ./deploy/azure/scripts/runtime-power.sh start deployment

      # Runtime preflight belongs AFTER acquisition. It checks the VM is really
      # running and that its persisted MySQL runtime config matches the current
      # Production secret before migrations/deployment begin.
      - name: Runtime deployment preflight
        shell: bash
        run: |
          set -euo pipefail
          ./deploy/azure/scripts/preflight.sh runtime

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Migrate databases and deploy changed Container Apps
        shell: bash
        env:
          IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}
          GIT_SHA: ${{ github.sha }}
          REBUILT_SERVICES: ${{ needs.build.outputs.services }}
          IMAGE_TAGS: ${{ needs.build.outputs.image_tags }}
          FORCE_REDEPLOY: ${{ inputs.force_redeploy }}
          REGISTRY_USERNAME: ${{ secrets.GHCR_PULL_USERNAME }}
          REGISTRY_PASSWORD: ${{ secrets.GHCR_PULL_TOKEN }}
        run: |
          set -euo pipefail
          export IMAGE_PREFIX="${IMAGE_PREFIX,,}"
          ./deploy/azure/scripts/deploy-container-apps.sh

      - name: Verify VM stack and monitoring
        shell: bash
        run: |
          printf '%s\n' '/opt/researchtrack/scripts/validate-vm-stack.sh' > "$RUNNER_TEMP/validate-vm-stack.run"
          ./deploy/azure/scripts/vm-run.sh "$RESOURCE_GROUP" "$INFRA_VM" "$RUNNER_TEMP/validate-vm-stack.run" \
            "EXPECT_APPS=true"

      - name: Verify private networking and Nginx -> Gateway
        shell: bash
        run: |
          printf '%s\n' '/opt/researchtrack/scripts/validate-infrastructure.sh' > "$RUNNER_TEMP/validate-infrastructure.run"
          ./deploy/azure/scripts/vm-run.sh "$RESOURCE_GROUP" "$INFRA_VM" "$RUNNER_TEMP/validate-infrastructure.run" \
            "EXPECT_APPS=true"

      - name: Verify public API endpoint
        if: vars.PRODUCTION_VERIFY_PUBLIC_ENDPOINT == 'true'
        shell: bash
        run: |
          set -euo pipefail
          for _ in $(seq 1 10); do
            curl -fsS --max-time 10 "https://$API_HOSTNAME/health/ready" >/dev/null && { echo "https://$API_HOSTNAME is serving."; exit 0; }
            sleep 6
          done
          echo "https://$API_HOSTNAME/health/ready did not succeed." >&2
          exit 1

      # Always return Production to exactly the state captured before this
      # deployment. This is intentionally after all deployment verification.
      # It also handles partial wake-up/deployment failures.
      - name: Restore exact pre-deployment runtime state
        if: always()
        shell: bash
        run: |
          set -u

          if [[ -z "${RUNTIME_STATE_FILE:-}" || ! -f "$RUNTIME_STATE_FILE" ]]; then
            echo "No runtime snapshot exists; no power-state mutation can be safely inferred."
            exit 0
          fi

          # No ownership marker means the workflow failed before it began
          # changing runtime state. Verify only; never overwrite an external
          # change in that situation.
          if [[ ! -f "${RUNTIME_ACTIVE_FILE:-}" ]]; then
            echo "Deployment never acquired runtime ownership. Verifying captured state only."
            ./deploy/azure/scripts/runtime-power.sh verify "$RUNTIME_STATE_FILE" || {
              echo "Runtime drift occurred before deployment ownership; refusing to overwrite it." >&2
              exit 1
            }
            exit 0
          fi

          restored=false
          for attempt in 1 2 3; do
            echo "Restoring pre-deployment Azure runtime state (attempt $attempt/3) ..."
            if ./deploy/azure/scripts/runtime-power.sh restore "$RUNTIME_STATE_FILE" && \
               ./deploy/azure/scripts/runtime-power.sh verify "$RUNTIME_STATE_FILE"; then
              restored=true
              rm -f "$RUNTIME_ACTIVE_FILE"
              break
            fi
            (( attempt < 3 )) && sleep 15
          done

          $restored || {
            echo "CRITICAL: Production runtime could not be restored automatically." >&2
            echo "Recovery artifact: azure-production-runtime-before-deploy-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" >&2
            exit 1
          }

          echo
          ./deploy/azure/scripts/runtime-power.sh status

      - name: Remove local environment files
        if: always()
        shell: bash
        run: rm -rf "$ENV_DIR" "$WORK_DIR" "$RUNTIME_ACTIVE_FILE"
