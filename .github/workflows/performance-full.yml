name: Performance Full

on:
  workflow_dispatch:
    inputs:
      profile:
        description: Performance profile to execute.
        required: true
        type: choice
        default: all
        options:
          - load
          - stress
          - all
      include_webhook_spike:
        description: Also run the signed GitHub ping webhook spike profile.
        required: false
        type: boolean
        default: false
      keep_environment_running:
        description: Leave Azure running after the test instead of restoring the captured state.
        required: false
        type: boolean
        default: false
      confirmation:
        description: Type RUN_FULL_PERFORMANCE to confirm a deliberate Production load/stress run.
        required: true
        type: string
  schedule:
    # Disabled unless the production Environment variable
    # ENABLE_NIGHTLY_PERFORMANCE=true. 02:30 UTC = 08:00 Sri Lanka time.
    - cron: '30 2 * * *'

concurrency:
  group: researchtrack-production-performance
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  full:
    name: k6 Full Performance (Azure Production)
    if: ${{ github.event_name == 'workflow_dispatch' || vars.ENABLE_NIGHTLY_PERFORMANCE == 'true' }}
    runs-on: ubuntu-latest
    environment: production

    env:
      RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP || 'rg-researchtrack-prod' }}
      INFRA_VM: ${{ vars.AZURE_INFRA_VM || 'vm-researchtrack-infra-prod' }}
      BASE_URL: ${{ vars.PERFORMANCE_BASE_URL || format('https://{0}', vars.PRODUCTION_API_HOSTNAME || 'api.researchtrack.blipzo.xyz') }}
      K6_TEST_PATH: ${{ vars.K6_TEST_PATH || '/health/ready' }}
      K6_LOAD_P95_MS: ${{ vars.K6_LOAD_P95_MS || '750' }}
      K6_STRESS_P95_MS: ${{ vars.K6_STRESS_P95_MS || '1200' }}
      K6_WEBHOOK_P95_MS: ${{ vars.K6_WEBHOOK_P95_MS || '1000' }}
      MANUAL_PROFILE: ${{ github.event_name == 'workflow_dispatch' && inputs.profile || 'load' }}
      INCLUDE_WEBHOOK_SPIKE: ${{ github.event_name == 'workflow_dispatch' && inputs.include_webhook_spike || false }}
      KEEP_ENVIRONMENT_RUNNING: ${{ github.event_name == 'workflow_dispatch' && inputs.keep_environment_running || false }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate run intent and Azure OIDC configuration
        shell: bash
        env:
          CONFIRMATION: ${{ github.event_name == 'workflow_dispatch' && inputs.confirmation || 'SCHEDULED' }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
        run: |
          set -euo pipefail
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" && "$CONFIRMATION" != "RUN_FULL_PERFORMANCE" ]]; then
            echo "Manual Production performance runs require confirmation text RUN_FULL_PERFORMANCE." >&2
            exit 1
          fi
          for key in AZURE_CLIENT_ID AZURE_TENANT_ID AZURE_SUBSCRIPTION_ID; do
            [[ -n "${!key:-}" ]] || { echo "$key is not configured in the production GitHub Environment." >&2; exit 1; }
          done

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Install Container Apps CLI extension
        shell: bash
        run: az extension add --name containerapp --upgrade --only-show-errors

      - name: Capture current Azure runtime state
        shell: bash
        run: |
          set -euo pipefail
          STATE_FILE="$RUNNER_TEMP/researchtrack-runtime-before-full-performance.json"
          echo "STATE_FILE=$STATE_FILE" >> "$GITHUB_ENV"
          ./deploy/azure/scripts/runtime-power.sh capture "$STATE_FILE"
          ./deploy/azure/scripts/runtime-power.sh status

      - name: Start Azure runtime
        shell: bash
        run: ./deploy/azure/scripts/runtime-power.sh start

      - name: Wait for public API readiness
        shell: bash
        run: |
          set -euo pipefail
          echo "Waiting for $BASE_URL/health/ready ..."
          for attempt in $(seq 1 60); do
            if curl -fsS --max-time 10 "$BASE_URL/health/ready" >/dev/null; then
              echo "ResearchTrack Production is ready."
              exit 0
            fi
            echo "Public API not ready yet ($attempt/60)."
            sleep 10
          done
          echo "Public API did not become ready within 10 minutes." >&2
          exit 1

      - name: Setup k6
        uses: grafana/setup-k6-action@v1

      - name: Run load profile
        if: ${{ env.MANUAL_PROFILE == 'load' || env.MANUAL_PROFILE == 'all' }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p performance-results
          k6 run \
            --summary-export=performance-results/load-summary.json \
            tests/Performance/load.js | tee performance-results/load-output.txt

      - name: Run stress profile
        if: ${{ github.event_name == 'workflow_dispatch' && (env.MANUAL_PROFILE == 'stress' || env.MANUAL_PROFILE == 'all') }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p performance-results
          k6 run \
            --summary-export=performance-results/stress-summary.json \
            tests/Performance/stress.js | tee performance-results/stress-output.txt

      - name: Prepare signed webhook performance probe
        if: ${{ github.event_name == 'workflow_dispatch' && env.INCLUDE_WEBHOOK_SPIKE == 'true' }}
        shell: bash
        env:
          RT_GITHUB_SERVICE_ENV: ${{ secrets.RT_GITHUB_SERVICE_ENV }}
        run: |
          set -euo pipefail
          webhook_secret="$(printf '%s\n' "$RT_GITHUB_SERVICE_ENV" | sed -n 's/^GitHub__WebhookSecret=//p' | head -n 1)"
          [[ -n "$webhook_secret" ]] || {
            echo "GitHub__WebhookSecret is missing from RT_GITHUB_SERVICE_ENV." >&2
            exit 1
          }
          echo "::add-mask::$webhook_secret"
          echo "GITHUB_WEBHOOK_SECRET=$webhook_secret" >> "$GITHUB_ENV"
          echo "WEBHOOK_DELIVERY_ID=rt-perf-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_ENV"

      - name: Run signed GitHub webhook spike
        if: ${{ github.event_name == 'workflow_dispatch' && env.INCLUDE_WEBHOOK_SPIKE == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p performance-results
          k6 run \
            --summary-export=performance-results/webhook-spike-summary.json \
            tests/Performance/webhook-spike.js | tee performance-results/webhook-spike-output.txt

      - name: Upload full performance results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: k6-full-${{ github.run_id }}
          path: performance-results/
          if-no-files-found: warn
          retention-days: 30

      - name: Restore Azure runtime state
        if: always() && env.KEEP_ENVIRONMENT_RUNNING != 'true'
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "${STATE_FILE:-}" && -f "$STATE_FILE" ]]; then
            ./deploy/azure/scripts/runtime-power.sh restore "$STATE_FILE"
            ./deploy/azure/scripts/runtime-power.sh status
          else
            echo "No captured state file exists; refusing to make an unconditional shutdown decision." >&2
          fi
