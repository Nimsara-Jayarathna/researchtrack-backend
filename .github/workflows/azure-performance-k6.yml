name: Azure Production - k6 Performance (VPS)

# Heavy performance profiles remain manual. Production deployment invokes the
# reusable workflow separately for automatic Smoke when enabled.
on:
  workflow_dispatch:
    inputs:
      profile:
        description: 'Performance profile (write/webhook use dedicated test data)'
        type: choice
        required: true
        default: smoke
        options: [smoke, load, stress, spike, write, lifecycle, webhook]
      p95_override_ms:
        description: 'Optional one-run overall p95 override in ms; leave blank to use GitHub profile variable/fallback'
        type: string
        required: false
        default: ''
      confirmation:
        description: 'Enter RUN_K6_PERFORMANCE to permit runtime start, testing and restore'
        type: string
        required: true

concurrency:
  group: researchtrack-azure-production
  cancel-in-progress: false
  queue: max

permissions:
  contents: read
  id-token: write

jobs:
  performance:
    uses: ./.github/workflows/azure-performance-k6-reusable.yml
    with:
      profile: ${{ inputs.profile }}
      execution_mode: manual
      confirmation: ${{ inputs.confirmation }}
      rate_limit_bypass_enabled: ${{ vars.K6_RATE_LIMIT_BYPASS_ENABLED == 'true' }}
      p95_override_ms: ${{ inputs.p95_override_ms }}
    secrets: inherit
