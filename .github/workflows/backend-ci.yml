name: Backend CI

on:
  pull_request:
    branches: ["develop", "main"]

permissions:
  contents: read

jobs:
  test:
    name: Restore, Build and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate deployment scripts and dashboard JSON
        shell: bash
        run: |
          set -euo pipefail
          bash -n \
            deploy/scripts/deploy-stack.sh \
            deploy/scripts/verify-health.sh \
            deploy/validate-env-files.sh \
            deploy/validate-shared-auth-wiring.sh \
            deploy/mysql/reconcile-databases.sh \
            deploy/azure/scripts/*.sh \
            deploy/azure/vm/scripts/*.sh \
            deploy/azure/validation/*.sh
          python -m py_compile deploy/azure/scripts/render-containerapp.py deploy/build/service-impact.py
          python -m json.tool deploy/monitoring/grafana/provisioning/dashboards/json/researchtrack-overview.json >/dev/null
          python -m json.tool deploy/monitoring/grafana/provisioning/dashboards/json/github-sync.json >/dev/null

      - name: Setup Node for k6 source validation
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validate k6 scripts and VPS performance automation
        shell: bash
        run: ./tests/performance/validate.sh

      - name: Test k6 detailed report renderer (synthetic metrics)
        shell: bash
        run: ./tests/performance/test-report.sh

      - name: Test k6 VPS orchestration (mocked SSH/k6)
        run: ./tests/performance/test-run-vps.sh

      - name: Test dynamic VPS IP discovery (mocked SSH)
        shell: bash
        run: ./tests/performance/test-discover-vps-ip.sh

      - name: Test Gateway exemption revision and failure recovery (mocked Azure)
        shell: bash
        run: ./tests/performance/test-gateway-exemption.sh

      - name: Test Azure runtime state-preservation logic (mocked Azure)
        shell: bash
        run: ./deploy/azure/validation/test-runtime-power.sh

      - name: Test Azure runtime readiness logic (mocked VM)
        shell: bash
        run: ./deploy/azure/validation/test-runtime-readiness.sh

      - name: Test Azure Production preflight power-state handling (mocked Azure)
        shell: bash
        run: ./deploy/azure/validation/test-preflight.sh

      - name: Validate Azure infrastructure definition
        run: |
          az bicep build --file deploy/azure/main.bicep --stdout >/dev/null
          az bicep build --file deploy/azure/modules/container-app.bicep --stdout >/dev/null

      - name: Test Azure Production env validator (synthetic values)
        run: ./deploy/azure/validation/test-validate-azure-env-files.sh

      - name: Test Kafka TLS smoke-test logic (stubbed Kafka)
        run: ./deploy/azure/validation/test-kafka-smoke.sh

      - name: Test VM private-IP safety check (stubbed ip)
        run: ./deploy/azure/validation/test-private-ip-check.sh

      - name: Test Container Apps network probe (stubbed az/Kafka)
        run: ./deploy/azure/validation/test-network-probe.sh

      - name: Test backend image selection model (synthetic repositories)
        run: python deploy/build/test_service_impact.py

      - name: Test Container Apps image selection (stubbed az/GHCR)
        run: ./deploy/azure/validation/test-deploy-image-selection.sh

      - name: Validate shared JWT wiring (Test, local, Azure Production)
        run: ./deploy/validate-shared-auth-wiring.sh

      - name: Test Container Apps environment composition (synthetic values)
        run: ./deploy/azure/validation/test-service-env-composition.sh

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: |
            **/*.csproj
            Directory.Packages.props

      - name: Restore
        run: dotnet restore ResearchTrack.sln

      - name: Build
        run: dotnet build ResearchTrack.sln -c Release --no-restore

      - name: Unit and mocking tests with coverage
        run: ./scripts/coverage.sh --no-build

      - name: Publish coverage summary
        if: always()
        shell: bash
        run: |
          if [[ -f artifacts/coverage/coverage-summary.md ]]; then
            cat artifacts/coverage/coverage-summary.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload unit and mocking coverage evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-mocking-coverage-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            artifacts/coverage/
            artifacts/test-results/unit/
          if-no-files-found: warn
          retention-days: 14
