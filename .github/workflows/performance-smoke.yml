name: Performance Smoke

on:
  workflow_dispatch:
    inputs:
      keep_environment_running:
        description: Leave Azure running after the test instead of restoring the captured state.
        required: false
        type: boolean
        default: false
  workflow_run:
    workflows: ["Backend Deploy - Production"]
    types: [completed]

concurrency:
  group: researchtrack-production-performance
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  smoke:
    name: k6 Smoke (Azure Production)
    # For workflow_run, only test a successfully deployed main revision.
    if: >-
      ${{
        github.event_name == 'workflow_dispatch' ||
        (github.event.workflow_run.conclusion == 'success' &&
         github.event.workflow_run.head_branch == 'main')
      }}
    runs-on: ubuntu-latest
    environment: production

    env:
      RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP || 'rg-researchtrack-prod' }}
      INFRA_VM: ${{ vars.AZURE_INFRA_VM || 'vm-researchtrack-infra-prod' }}
      BASE_URL: ${{ vars.PERFORMANCE_BASE_URL || format('https://{0}', vars.PRODUCTION_API_HOSTNAME || 'api.researchtrack.blipzo.xyz') }}
      K6_SMOKE_P95_MS: ${{ vars.K6_SMOKE_P95_MS || '500' }}
      K6_TEST_PATH: ${{ vars.K6_TEST_PATH || '/health/ready' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # workflow_run executes in the default branch context. Test the exact
          # source revision that the deployment workflow completed.
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}

      - name: Validate Azure OIDC configuration
        shell: bash
        env:
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
        run: |
          set -euo pipefail
          for key in AZURE_CLIENT_ID AZURE_TENANT_ID AZURE_SUBSCRIPTION_ID; do
            [[ -n "${!key:-}" ]] || { echo "$key is not configured in the production GitHub Environment." >&2; exit 1; }
          done

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Install Container Apps CLI extension
        shell: bash
        run: az extension add --name containerapp --upgrade --only-show-errors

      - name: Capture current Azure runtime state
        shell: bash
        run: |
          set -euo pipefail
          STATE_FILE="$RUNNER_TEMP/researchtrack-runtime-before-smoke.json"
          echo "STATE_FILE=$STATE_FILE" >> "$GITHUB_ENV"
          ./deploy/azure/scripts/runtime-power.sh capture "$STATE_FILE"
          ./deploy/azure/scripts/runtime-power.sh status

      - name: Start Azure runtime
        shell: bash
        run: ./deploy/azure/scripts/runtime-power.sh start

      - name: Wait for public API readiness
        shell: bash
        run: |
          set -euo pipefail
          echo "Waiting for $BASE_URL/health/ready ..."
          for attempt in $(seq 1 60); do
            if curl -fsS --max-time 10 "$BASE_URL/health/ready" >/dev/null; then
              echo "ResearchTrack Production is ready."
              exit 0
            fi
            echo "Public API not ready yet ($attempt/60)."
            sleep 10
          done
          echo "Public API did not become ready within 10 minutes." >&2
          exit 1

      - name: Setup k6
        uses: grafana/setup-k6-action@v1

      - name: Run k6 smoke gate
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p performance-results
          k6 run \
            --summary-export=performance-results/smoke-summary.json \
            tests/Performance/smoke.js | tee performance-results/smoke-output.txt

      - name: Upload smoke results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: k6-smoke-${{ github.run_id }}
          path: performance-results/
          if-no-files-found: warn
          retention-days: 30

      - name: Restore Azure runtime state
        if: always() && !(github.event_name == 'workflow_dispatch' && inputs.keep_environment_running)
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "${STATE_FILE:-}" && -f "$STATE_FILE" ]]; then
            ./deploy/azure/scripts/runtime-power.sh restore "$STATE_FILE"
            ./deploy/azure/scripts/runtime-power.sh status
          else
            echo "No captured state file exists; refusing to make an unconditional shutdown decision." >&2
          fi
