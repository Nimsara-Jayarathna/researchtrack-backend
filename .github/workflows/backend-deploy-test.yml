name: Backend Deploy - Test

on:
  push:
    branches: ["develop"]
  workflow_dispatch:
    inputs:
      force_full_build:
        description: Build and publish all backend service images before deploying.
        required: false
        type: boolean
        default: false

concurrency:
  group: researchtrack-backend-test-deployment
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  deploy:
    name: Build and Deploy Test
    uses: ./.github/workflows/backend-deploy-reusable.yml
    with:
      environment_name: test
      force_full_build: ${{ inputs.force_full_build || false }}
    permissions:
      contents: read
      packages: write
    secrets: inherit
