name: Azure Production - k6 Performance Reusable

on:
  workflow_call:
    inputs:
      profile:
        description: Performance profile to execute.
        required: true
        type: string
      execution_mode:
        description: manual or automatic-post-deploy
        required: false
        type: string
        default: manual
      confirmation:
        description: Manual safety confirmation. Ignored for automatic post-deploy Smoke.
        required: false
        type: string
        default: ''
      rate_limit_bypass_enabled:
        description: Temporarily exempt the dynamically discovered VPS IP from the general Gateway limiter.
        required: false
        type: boolean
        default: false
      p95_override_ms:
        description: Optional one-run overall p95 override; normal runs use profile-specific GitHub variables.
        required: false
        type: string
        default: ''

permissions:
  contents: read
  id-token: write

jobs:
  performance:
    name: Acquire runtime → VPS k6 → Restore
    runs-on: ubuntu-latest
    timeout-minutes: 70
    environment: production
    env:
      RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP || 'rg-researchtrack-prod' }}
      INFRA_VM: ${{ vars.AZURE_INFRA_VM || 'vm-researchtrack-infra-prod' }}
      RUNTIME_PUBLIC_HEALTH_URL: ${{ vars.PRODUCTION_VERIFY_PUBLIC_ENDPOINT == 'true' && format('https://{0}/health/ready', vars.PRODUCTION_API_HOSTNAME || 'api.researchtrack.blipzo.xyz') || '' }}
      K6_RATE_LIMIT_BYPASS_ENABLED: ${{ inputs.rate_limit_bypass_enabled && 'true' || 'false' }}
      K6_PROFILE: ${{ inputs.profile }}
      K6_EXECUTION_MODE: ${{ inputs.execution_mode }}
      K6_LOCAL_REPORT_DIR: ${{ github.workspace }}/reports/performance

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate request and production configuration
        shell: bash
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
          P95_OVERRIDE_MS: ${{ inputs.p95_override_ms }}
          ENDPOINT_THRESHOLDS_JSON: ${{ vars.K6_ENDPOINT_P95_THRESHOLDS_JSON || '' }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          K6_PERFORMANCE_TOKEN: ${{ secrets.K6_PERFORMANCE_TOKEN }}
          K6_SUPERVISOR_EMAIL: ${{ secrets.K6_SUPERVISOR_EMAIL }}
          K6_SUPERVISOR_PASSWORD: ${{ secrets.K6_SUPERVISOR_PASSWORD }}
          K6_STUDENT_EMAIL: ${{ secrets.K6_STUDENT_EMAIL }}
          K6_STUDENT_PASSWORD: ${{ secrets.K6_STUDENT_PASSWORD }}
          K6_PROJECT_ID: ${{ vars.K6_PROJECT_ID }}
          K6_BASE_URL: ${{ vars.K6_BASE_URL }}
        run: |
          set -euo pipefail
          [[ "$K6_PROFILE" =~ ^(smoke|load|stress|spike|write|lifecycle|webhook)$ ]] || {
            echo "Unsupported performance profile: $K6_PROFILE" >&2; exit 1;
          }
          [[ "$K6_EXECUTION_MODE" =~ ^(manual|automatic-post-deploy)$ ]] || {
            echo 'execution_mode must be manual or automatic-post-deploy.' >&2; exit 1;
          }
          if [[ "$K6_EXECUTION_MODE" == manual ]]; then
            [[ "$CONFIRMATION" == RUN_K6_PERFORMANCE ]] || {
              echo 'Confirmation must be RUN_K6_PERFORMANCE.' >&2; exit 1;
            }
          else
            [[ "$K6_PROFILE" == smoke ]] || {
              echo 'Automatic post-deploy execution is restricted to the Smoke profile.' >&2; exit 1;
            }
            [[ "$K6_RATE_LIMIT_BYPASS_ENABLED" == false ]] || {
              echo 'Automatic Smoke must use normal Gateway rate limiting.' >&2; exit 1;
            }
          fi
          for key in AZURE_CLIENT_ID AZURE_TENANT_ID AZURE_SUBSCRIPTION_ID \
            SSH_HOST SSH_PORT SSH_USER SSH_PRIVATE_KEY \
            K6_SUPERVISOR_EMAIL K6_SUPERVISOR_PASSWORD \
            K6_STUDENT_EMAIL K6_STUDENT_PASSWORD K6_PROJECT_ID K6_BASE_URL; do
            [[ -n "${!key:-}" ]] || { echo "Missing configuration $key" >&2; exit 1; }
          done
          [[ "$K6_BASE_URL" == https://* ]] || { echo 'HTTPS is required.' >&2; exit 1; }
          [[ "$K6_RATE_LIMIT_BYPASS_ENABLED" =~ ^(true|false)$ ]] || {
            echo 'K6_RATE_LIMIT_BYPASS_ENABLED must be true or false.' >&2; exit 1;
          }
          if [[ "$K6_RATE_LIMIT_BYPASS_ENABLED" == true ]]; then
            [[ ${#K6_PERFORMANCE_TOKEN} -ge 32 ]] || {
              echo 'K6_PERFORMANCE_TOKEN is required (32+ characters) for an enabled exemption.' >&2; exit 1;
            }
          fi
          if [[ -n "$P95_OVERRIDE_MS" ]]; then
            python3 - "$P95_OVERRIDE_MS" <<'PY'
          import math, sys
          try: value=float(sys.argv[1])
          except ValueError: raise SystemExit('p95_override_ms must be numeric')
          if not math.isfinite(value) or value <= 0: raise SystemExit('p95_override_ms must be positive')
          PY
          fi
          python3 - "$ENDPOINT_THRESHOLDS_JSON" <<'PY'
          import json, math, sys
          raw=sys.argv[1].strip()
          if not raw:
              raise SystemExit(0)
          try: value=json.loads(raw)
          except json.JSONDecodeError as exc: raise SystemExit(f'K6_ENDPOINT_P95_THRESHOLDS_JSON is invalid JSON: {exc}')
          if not isinstance(value, dict): raise SystemExit('K6_ENDPOINT_P95_THRESHOLDS_JSON must be a JSON object')
          allowed = {
              'projects','project_details','requirements','submissions',
              'jira_issues','jira_sprint_progress','github_activity','supervisor_dashboard',
              'requirement_create','requirement_delete','v1_session','v1_object_storage','v1_complete',
              'review_request_changes','v2_session','v2_object_storage','v2_complete','review_approve',
              'verify_version_history','archive_test_requirement','jira_webhook',
          }
          for key, item in value.items():
              if key not in allowed:
                  raise SystemExit(f'Unknown endpoint threshold operation: {key!r}')
              if isinstance(item, bool) or not isinstance(item, (int, float)) or not math.isfinite(item) or item <= 0:
                  raise SystemExit(f'Endpoint threshold {key!r} must be a positive number')
          PY
          echo "STATE_FILE=$RUNNER_TEMP/researchtrack-k6-runtime-state.json" >> "$GITHUB_ENV"
          echo "ACTIVE_FILE=$RUNNER_TEMP/researchtrack-k6-runtime.active" >> "$GITHUB_ENV"
          echo "K6_GATEWAY_STATE_FILE=$RUNNER_TEMP/researchtrack-k6-gateway-state.json" >> "$GITHUB_ENV"
          echo "K6_GATEWAY_ACTIVE_FILE=$RUNNER_TEMP/researchtrack-k6-gateway.active" >> "$GITHUB_ENV"

      - name: Validate performance scripts
        shell: bash
        run: ./tests/performance/validate.sh

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Install Container Apps CLI extension
        shell: bash
        run: az extension add --name containerapp --upgrade --only-show-errors

      - name: Discover VPS egress IPv4 using existing Test CI SSH secrets
        if: env.K6_RATE_LIMIT_BYPASS_ENABLED == 'true'
        shell: bash
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          ip="$(./scripts/performance/discover-vps-ip.sh)"
          echo "K6_VPS_EGRESS_IP=$ip" >> "$GITHUB_ENV"
          echo "Validated current VPS outgoing IPv4: $ip"

      - name: Capture exact original runtime state
        shell: bash
        run: |
          set -euo pipefail
          ./deploy/azure/scripts/runtime-power.sh capture "$STATE_FILE"
          ./deploy/azure/scripts/runtime-power.sh validate-snapshot "$STATE_FILE"
          ./deploy/azure/scripts/runtime-power.sh status

      - name: Preserve power-state recovery artifact
        uses: actions/upload-artifact@v4
        with:
          name: azure-k6-runtime-state-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.STATE_FILE }}
          if-no-files-found: error
          retention-days: 7

      - name: Capture original Gateway revision and routing state
        if: env.K6_RATE_LIMIT_BYPASS_ENABLED == 'true'
        shell: bash
        run: ./scripts/performance/gateway-exemption.sh capture "$K6_GATEWAY_STATE_FILE"

      - name: Preserve Gateway recovery artifact
        if: env.K6_RATE_LIMIT_BYPASS_ENABLED == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: azure-k6-gateway-state-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.K6_GATEWAY_STATE_FILE }}
          if-no-files-found: error
          retention-days: 7

      - name: Start Azure → optional Gateway allowance → VPS k6 → restore Gateway and Azure
        shell: bash
        env:
          RUNTIME_SESSION_REUSE_SNAPSHOT: 'true'
          RUNTIME_SESSION_ACTIVE_FILE: ${{ env.ACTIVE_FILE }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          K6_BASE_URL: ${{ vars.K6_BASE_URL }}
          K6_PROJECT_ID: ${{ vars.K6_PROJECT_ID }}
          K6_PERFORMANCE_TOKEN: ${{ secrets.K6_PERFORMANCE_TOKEN }}
          K6_SUPERVISOR_EMAIL: ${{ secrets.K6_SUPERVISOR_EMAIL }}
          K6_SUPERVISOR_PASSWORD: ${{ secrets.K6_SUPERVISOR_PASSWORD }}
          K6_STUDENT_EMAIL: ${{ secrets.K6_STUDENT_EMAIL }}
          K6_STUDENT_PASSWORD: ${{ secrets.K6_STUDENT_PASSWORD }}
          K6_INCLUDE_INTEGRATIONS: ${{ vars.K6_INCLUDE_INTEGRATIONS || 'false' }}
          K6_P95_MS: ${{ inputs.p95_override_ms }}
          K6_SMOKE_P95_MS: ${{ vars.K6_SMOKE_P95_MS || '' }}
          K6_LOAD_P95_MS: ${{ vars.K6_LOAD_P95_MS || '' }}
          K6_STRESS_P95_MS: ${{ vars.K6_STRESS_P95_MS || '' }}
          K6_SPIKE_P95_MS: ${{ vars.K6_SPIKE_P95_MS || '' }}
          K6_WRITE_P95_MS: ${{ vars.K6_WRITE_P95_MS || '' }}
          K6_LIFECYCLE_P95_MS: ${{ vars.K6_LIFECYCLE_P95_MS || '' }}
          K6_WEBHOOK_P95_MS: ${{ vars.K6_WEBHOOK_P95_MS || '' }}
          K6_ENDPOINT_P95_THRESHOLDS_JSON: ${{ vars.K6_ENDPOINT_P95_THRESHOLDS_JSON || '' }}
          K6_WARMUP_PASSES: ${{ vars.K6_WARMUP_PASSES || '1' }}
          K6_EXECUTION_MODE: ${{ inputs.execution_mode }}
          K6_GITHUB_RUN_ID: ${{ github.run_id }}
          K6_GITHUB_RUN_ATTEMPT: ${{ github.run_attempt }}
          K6_GITHUB_SHA: ${{ github.sha }}
          K6_GITHUB_WORKFLOW: ${{ github.workflow }}
          K6_STUDENT_ID: ${{ vars.K6_STUDENT_ID || '' }}
          K6_ENABLE_WRITES: ${{ (inputs.profile == 'write' || inputs.profile == 'lifecycle') && 'true' || 'false' }}
          K6_ENABLE_WEBHOOK: ${{ inputs.profile == 'webhook' && 'true' || 'false' }}
          K6_JIRA_PROJECT_KEY: ${{ vars.K6_JIRA_PROJECT_KEY || '' }}
          K6_JIRA_ISSUE_KEY: ${{ vars.K6_JIRA_ISSUE_KEY || '' }}
          K6_JIRA_ISSUE_ID: ${{ vars.K6_JIRA_ISSUE_ID || '' }}
          K6_JIRA_WEBHOOK_CLIENT_SECRET: ${{ secrets.K6_JIRA_WEBHOOK_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          ./deploy/azure/scripts/runtime-session.sh "$STATE_FILE" -- \
            ./scripts/performance/run-gateway-session.sh

      - name: Final Gateway configuration restoration safeguard
        if: always()
        shell: bash
        run: |
          set -u
          if [[ "${K6_RATE_LIMIT_BYPASS_ENABLED:-false}" != true ||
                -z "${K6_GATEWAY_STATE_FILE:-}" || ! -f "$K6_GATEWAY_STATE_FILE" ]]; then
            echo 'No captured/owned Gateway allowance to restore.'
            exit 0
          fi
          if [[ ! -f "${K6_GATEWAY_ACTIVE_FILE:-}" ]]; then
            ./scripts/performance/gateway-exemption.sh verify "$K6_GATEWAY_STATE_FILE"
            exit $?
          fi
          for attempt in 1 2 3; do
            echo "Final Gateway restore attempt $attempt/3 ..."
            if ./scripts/performance/gateway-exemption.sh restore "$K6_GATEWAY_STATE_FILE"; then
              rm -f "$K6_GATEWAY_ACTIVE_FILE"
              exit 0
            fi
            if ((attempt < 3)); then sleep 10; fi
          done
          echo 'CRITICAL: Gateway configuration restoration failed. Use Gateway recovery artifact.' >&2
          exit 1

      - name: Final restoration safeguard
        if: always()
        shell: bash
        run: |
          set -u
          if [[ -z "${STATE_FILE:-}" || ! -f "$STATE_FILE" ]]; then
            echo 'No snapshot; no owned runtime mutation to restore.'
            exit 0
          fi
          if [[ ! -f "${ACTIVE_FILE:-}" ]]; then
            echo 'No unfinished session ownership; verify only.'
            ./deploy/azure/scripts/runtime-power.sh verify "$STATE_FILE"
            exit $?
          fi
          restored=false
          for attempt in 1 2 3; do
            echo "Final restore attempt $attempt/3 ..."
            if ./deploy/azure/scripts/runtime-power.sh restore "$STATE_FILE" && \
               ./deploy/azure/scripts/runtime-power.sh verify "$STATE_FILE"; then
              restored=true
              rm -f "$ACTIVE_FILE"
              break
            fi
            ((attempt < 3)) && sleep 15
          done
          $restored || {
            echo 'CRITICAL: Restore failed. Use the captured Azure state artifact.' >&2
            exit 1
          }

      - name: Upload k6 evidence even on failed thresholds
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: k6-${{ inputs.profile }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: reports/performance/
          if-no-files-found: warn
          retention-days: 14

      - name: Add performance summary to GitHub Actions
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          echo '## ResearchTrack Production — k6 Performance' >> "$GITHUB_STEP_SUMMARY"
          echo >> "$GITHUB_STEP_SUMMARY"
          echo "Profile: **${K6_PROFILE}** | Mode: **${K6_EXECUTION_MODE}** | Gateway exemption: **${K6_RATE_LIMIT_BYPASS_ENABLED}**" >> "$GITHUB_STEP_SUMMARY"
          echo 'The gateway revision (when modified) and Azure power state are restored independently.' >> "$GITHUB_STEP_SUMMARY"
          report="reports/performance/${K6_PROFILE}-report.md"
          if [[ -f "$report" ]]; then
            cat "$report" >> "$GITHUB_STEP_SUMMARY"
            echo >> "$GITHUB_STEP_SUMMARY"
            echo '### Detailed report artifact' >> "$GITHUB_STEP_SUMMARY"
            echo 'The uploaded k6 artifact also contains a self-contained HTML report, endpoint CSV, raw log and detailed JSON summary.' >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'No k6 metrics report was produced; see the workflow failure logs.' >> "$GITHUB_STEP_SUMMARY"
          fi
