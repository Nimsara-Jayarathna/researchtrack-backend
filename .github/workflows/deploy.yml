name: Deploy

on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed
    branches:
      - develop
      - main

permissions:
  contents: read

jobs:
  deploy-test:
    name: Deploy Test
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'develop' }}
    runs-on: ubuntu-latest
    environment: test
    steps:
      - name: Record Test deployment gate
        run: |
          echo "Deploy backend services for commit ${{ github.event.workflow_run.head_sha }} to the isolated Test environment."
          echo "Configure this job with Docker image publishing and hosting provider credentials when deployment infrastructure is ready."

  deploy-production:
    name: Deploy Production
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main' }}
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Record Production deployment gate
        run: |
          echo "Deploy backend services for commit ${{ github.event.workflow_run.head_sha }} to the isolated Production environment."
          echo "Require GitHub Environment approval for production deployments."
