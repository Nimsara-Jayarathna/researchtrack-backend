name: Kafka Isolated Integration - Manual
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  kafka-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Test GitHub and Jira with disposable TLS Kafka and MySQL
        run: bash scripts/test-kafka-integration.sh
      - name: Upload isolated integration evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: isolated-kafka-integration-${{ github.run_id }}
          path: artifacts/kafka-integration/*.trx
          if-no-files-found: warn
          retention-days: 14
