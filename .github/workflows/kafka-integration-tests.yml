name: Kafka Isolated Integration - Manual
on:
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
jobs:
  kafka-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0; Node 24
        with:
          dotnet-version: '10.0.x'
      - name: Test GitHub and Jira with disposable TLS Kafka and MySQL
        run: bash scripts/test-kafka-integration.sh
      - name: Upload isolated integration evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: isolated-kafka-integration-${{ github.run_id }}
          path: artifacts/kafka-integration/
          if-no-files-found: warn
          retention-days: 14
