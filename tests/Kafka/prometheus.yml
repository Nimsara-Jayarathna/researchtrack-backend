# Isolated fixture only. Production alert durations are tested unchanged by promtool.
global:
  scrape_interval: 5s
  evaluation_interval: 5s
rule_files: [/etc/prometheus/rules/*.yml]
scrape_configs:
  - job_name: researchtrack-kafka
    scrape_timeout: 4s
    static_configs:
      - targets: ['kafka-exporter:9308']
        labels: {service: kafka, environment: isolated}
    metric_relabel_configs:
      - source_labels: [__name__]
        regex: kafka_broker_info
        action: drop
  - job_name: researchtrack-services
    metrics_path: /github.prom
    static_configs:
      - targets: ['metric-snapshots:8080']
        labels: {service: github, environment: isolated}
  - job_name: researchtrack-jira-snapshot
    metrics_path: /jira.prom
    static_configs:
      - targets: ['metric-snapshots:8080']
        labels: {service: jira, environment: isolated}
    relabel_configs:
      - target_label: job
        replacement: researchtrack-services
